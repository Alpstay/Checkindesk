<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AlpStay · Self check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111110;
  --ink-soft:#6B6A66;
  --ink-faint:#9C9A93;
  --paper:#FFFFFF;
  --paper-2:#FAF9F6;
  --line:#E7E3D9;
  --gold:#B08D4F;
  --gold-deep:#8A6A34;
  --gold-pale:#F2EADA;
  --grad:linear-gradient(180deg,#E4CE9B 0%,#B08D4F 55%,#8A6A34 100%);
  --ok:#3B6D11;
  --warn:#854F0B;
  --radius:4px;
  --tap:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Lato',-apple-system,'Segoe UI',sans-serif;
  font-weight:400;font-size:18px;line-height:1.6;
  display:flex;justify-content:center;
}
h1,h2,h3,.display{font-family:'Belleza',Georgia,serif;font-weight:400;letter-spacing:.01em;margin:0}
h1{font-size:40px;line-height:1.15}
h2{font-size:30px;line-height:1.2}
h3{font-size:22px}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:18px;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.demobar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:#EDE9E0;padding:10px 26px;font-size:13px;letter-spacing:.04em}
.demobar .lbl{opacity:.72}
.demobar .dbtns{display:flex;gap:6px;flex-wrap:wrap}
.demobar button{padding:7px 13px;border:1px solid rgba(255,255,255,.22);border-radius:3px;color:#EDE9E0;font-size:13px;transition:background .15s}
.demobar button:hover{background:rgba(255,255,255,.1)}
.demobar button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
#app{width:100%;max-width:760px;min-height:100%;display:flex;flex-direction:column;background:var(--paper)}

/* ---------- intestazione ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px 0}
.mark{height:44px;width:auto;display:block}
.mark--hero{height:150px;margin:0 auto}
.langpick{display:flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);font-size:16px;color:var(--ink);min-height:46px}
.langpick:hover{border-color:var(--gold)}
.langpick svg{width:19px;height:19px;stroke:var(--gold-deep);fill:none;stroke-width:1.4}
.langgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
@media(max-width:520px){.langgrid{grid-template-columns:repeat(2,1fr)}}
.langgrid button{padding:18px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:17px;color:var(--ink);min-height:62px}
.langgrid button:hover{border-color:var(--gold)}
.langgrid button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-pale)}

/* ---------- corpo ---------- */
main{flex:1;padding:26px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:in .28s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px;padding:12px 0 30px}
.hero .greet{font-size:19px;color:var(--ink-soft)}
.rule{width:52px;height:2px;background:var(--grad);margin:22px auto 26px;border-radius:2px}

.choice{display:grid;gap:16px;margin-top:4px}
.pick{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  padding:26px 28px;text-align:left;display:flex;align-items:center;gap:20px;
  transition:border-color .15s,background .15s;min-height:112px;
}
.pick:hover,.pick:active{border-color:var(--gold);background:var(--paper-2)}
.pick .glyph{width:46px;flex:0 0 46px;height:46px;border-radius:50%;background:var(--gold-pale);display:grid;place-items:center;color:var(--gold-deep)}
.pick .word{font-family:'Belleza',serif;font-size:30px;letter-spacing:.16em;line-height:1.1}
.pick .sub{font-size:16px;color:var(--ink-soft);margin-top:2px}

/* ---------- passi ---------- */
.steps{display:flex;gap:6px;align-items:center;margin-bottom:22px}
.steps i{height:3px;flex:1;background:var(--line);border-radius:2px}
.steps i.done{background:var(--grad)}
.steps span{font-size:14px;color:var(--ink-faint);margin-left:8px;white-space:nowrap}

.head{margin-bottom:22px}
.head .lead{font-size:17px;color:var(--ink-soft);margin-top:6px}

.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select{
  width:100%;height:var(--tap);padding:0 16px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);
}
.field input:focus,.field select:focus{border-color:var(--gold);outline:none}
.field input::placeholder{color:var(--ink-faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.two{grid-template-columns:1fr}}

.card{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;background:var(--paper-2)}
.card+.card{margin-top:14px}
.rowline{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:17px}
.rowline+.rowline{border-top:1px solid var(--line)}
.rowline .k{color:var(--ink-soft)}
.rowline .v{text-align:right}
.tot{font-family:'Belleza',serif;font-size:24px}

.note{font-size:15px;color:var(--ink-soft);background:var(--gold-pale);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.err{font-size:15px;color:#A32D2D;margin-top:10px;min-height:22px}

.scan{border:1px dashed var(--gold);border-radius:var(--radius);padding:30px 22px;text-align:center;background:var(--paper-2);margin-bottom:20px}
.scan .big{font-family:'Belleza',serif;font-size:22px;margin-bottom:6px}
.scan .sub{font-size:15px;color:var(--ink-soft);margin-bottom:18px}

.pax{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;background:var(--paper)}
.roomhead{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.roomhead b{font-family:'Belleza',serif;font-weight:400;font-size:23px}
.roomhead span{font-size:15px;color:var(--ink-soft);white-space:nowrap}
.roomhead i{flex:1;height:1px;background:var(--line)}
.namecard{display:flex;flex-direction:column;gap:2px;padding:11px 0;font-size:18px}
.namecard+.namecard{border-top:1px solid var(--line)}
.pax .tag{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;letter-spacing:.12em;color:var(--gold-deep);margin-bottom:12px}
.pax .state{letter-spacing:0;color:var(--ink-faint)}
.pax.filled .state{color:var(--ok)}
.pax.waiting{border-color:var(--gold);background:var(--paper-2)}
.pax .scanbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;margin-bottom:16px;border:1px solid var(--gold);border-radius:var(--radius);background:var(--paper);color:var(--gold-deep);font-size:16px;letter-spacing:.06em;transition:background .15s}
.pax .scanbtn:hover{background:var(--gold-pale)}
.pax .scanbtn svg{width:20px;height:20px;stroke:var(--gold-deep);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pax.filled .scanbtn{border-color:var(--line);color:var(--ink-faint)}
.pax.filled .scanbtn svg{stroke:var(--ink-faint)}
.scan .sub b{font-weight:400;color:var(--ink)}
.scan .btn[disabled]{background:var(--line);color:var(--ink-faint)}

.check{display:flex;gap:14px;align-items:flex-start;padding:16px 0;cursor:pointer}
.check input{width:26px;height:26px;flex:0 0 26px;margin-top:2px;accent-color:var(--gold-deep)}
.check span{font-size:16px;line-height:1.5}
.check a{color:var(--gold-deep)}

.actions{margin-top:auto;padding-top:26px;display:flex;gap:14px;align-items:center}
.btn{
  min-height:var(--tap);padding:0 34px;border-radius:var(--radius);
  background:var(--ink);color:#fff;font-size:18px;letter-spacing:.04em;flex:1;
  transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn[disabled]{background:var(--line);color:var(--ink-faint);cursor:not-allowed}
.btn--ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);flex:0 0 auto;padding:0 24px}

.spinner{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

.final{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.roomno{font-family:'Belleza',serif;font-size:88px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 4px}
.roomlist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 4px}
.roomlist b{font-family:'Belleza',serif;font-size:26px;font-weight:400;border:1px solid var(--line);border-radius:var(--radius);padding:8px 18px}

/* ---------- piè di pagina ---------- */
.emergency{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 26px;border-top:1px solid var(--line);font-size:15px;color:var(--ink-soft);flex-wrap:wrap}
.emergency b{font-weight:700;color:var(--ink);letter-spacing:.03em}
.emergency .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.info{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media(max-width:620px){.info{grid-template-columns:repeat(3,1fr)}}
.info button{background:var(--paper);padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);min-height:82px;transition:background .15s}
.info button:hover{background:var(--paper-2);color:var(--ink)}
.info svg{width:22px;height:22px;stroke:var(--gold-deep);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlay ---------- */
.sheet{position:fixed;inset:0;background:rgba(17,17,16,.42);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .inner{background:var(--paper);width:100%;max-width:760px;border-radius:10px 10px 0 0;padding:28px 26px 34px;max-height:86vh;overflow:auto}
.sheet h3{margin-bottom:10px}
.sheet .body{font-size:17px;color:var(--ink-soft);line-height:1.65}
.sheet .close{margin-top:24px;width:100%}
.modal{position:fixed;inset:0;background:rgba(17,17,16,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
.modal.on{display:flex}
.modal .box{background:var(--paper);border-radius:10px;max-width:620px;width:100%;padding:46px 40px 38px;text-align:center;max-height:90vh;overflow:auto;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal .box{animation:none}}
.modal .clock{width:48px;height:48px;stroke:var(--gold-deep);fill:none;stroke-width:1.2;stroke-linecap:round}
.modal .from{font-size:15px;letter-spacing:.14em;color:var(--ink-faint);margin-top:14px}
.modal .hour{font-family:'Belleza',serif;font-size:82px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:2px 0 18px}
.modal h2{margin-bottom:14px}
.modal .msg{color:var(--ink-soft);font-size:18px;line-height:1.65}
.modal .tips{border-top:1px solid var(--line);margin-top:30px;padding-top:22px;text-align:left}
.modal .tiplabel{font-size:13px;letter-spacing:.14em;color:var(--gold-deep);margin-bottom:14px}
.modal .tip{font-size:16px;line-height:1.55;color:var(--ink-soft);padding-left:20px;position:relative}
.modal .tip+.tip{margin-top:13px}
.modal .tip::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.modal .btn{margin-top:30px;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const S = { lang:'it', mode:null, res:null, screen:'home', data:{}, timer:null, keyIdx:0, target:0, demoHour:'' };
const t = k => T[S.lang][k] || k;
const main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* il check-in apre a un'ora fissa: prima di allora si mostra il pop-up di attesa */
function nowMinutes(){
  if(/^\d{1,2}:\d{2}$/.test(S.demoHour || '')){
    const [h, m] = S.demoHour.split(':').map(Number);
    return h * 60 + m;
  }
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function checkinOpen(){
  const [h, m] = CONFIG.checkinFrom.split(':').map(Number);
  return nowMinutes() >= h * 60 + m;
}
function showEarly(){
  document.getElementById('earlyFrom').textContent = t('earlyFrom');
  document.getElementById('earlyHour').textContent = CONFIG.checkinFrom;
  document.getElementById('earlyTitle').textContent = t('earlyTitle');
  document.getElementById('earlyBody').textContent = t('earlyBody');
  document.getElementById('earlyMeanwhile').textContent = t('meanwhile');
  document.getElementById('earlyTip1').textContent = t('tipOnline');
  document.getElementById('earlyTip2').textContent = t('tipPass');
  document.getElementById('earlyBtn').textContent = t('earlyBtn');
  document.getElementById('early').classList.add('on');
}

/* percorsi: la sequenza dipende dal caso riconosciuto sulla prenotazione */
function path(){
  if(S.mode === 'out') return ['coSearch','coSummary','coKey'];
  if(!S.res) return ['search'];
  const first = S.res.online ? 'confirm' : (S.res.type === 'group' ? 'group' : 'docs');
  return ['search', first, 'terms', 'pay', 'key'];
}
function stepsBar(){
  const p = path(), i = p.indexOf(S.screen);
  if(i < 0) return '';
  return '<div class="steps">' + p.map((_,n)=>'<i class="'+(n<=i?'done':'')+'"></i>').join('') +
         '<span>' + (i+1) + '/' + p.length + '</span></div>';
}
const head = (title, lead) => '<div class="head"><h2>'+esc(title)+'</h2><p class="lead">'+esc(lead)+'</p></div>';
const actions = (nextLabel, nextId, backTo) =>
  '<div class="actions">' +
  (backTo ? '<button class="btn btn--ghost" data-go="'+backTo+'">'+esc(t('back'))+'</button>' : '') +
  '<button class="btn" id="'+nextId+'">'+esc(nextLabel)+'</button></div>';

const ROOMTYPE = {
  single:{ it:'Singola', de:'Einzelzimmer', en:'Single' },
  double:{ it:'Doppia',  de:'Doppelzimmer', en:'Double' },
  triple:{ it:'Tripla',  de:'Dreibettzimmer', en:'Triple' },

/* rooming list del PMS, oppure quella compilata dal capogruppo al chiosco */
function roomingList(){
  if(S.data.rooming) return S.data.rooming;
  if(S.res.rooming) return S.res.rooming;
  return S.res.rooms.map(r => ({ room:r, kind:'', guests:[] }));
}

function buildRooming(){
  const out = [];
  document.querySelectorAll('[data-roomblock]').forEach(block => {
    const guests = [];
    block.querySelectorAll('.pax').forEach(b => {
      const nome = b.querySelector('[data-f="name"]').value.trim();
      const cognome = b.querySelector('[data-f="surname"]').value.trim();
      guests.push((nome + ' ' + cognome).trim());
    });
    out.push({ room: block.dataset.roomblock, kind: block.dataset.kind, guests });
  });
  return out;
}

const LOC = { it:'it-IT', de:'de-AT', en:'en-IE', fr:'fr-FR', es:'es-ES', pt:'pt-PT', ru:'ru-RU', zh:'zh-CN', ko:'ko-KR' };
const money = n => new Intl.NumberFormat(LOC[S.lang], { style:'currency', currency:'EUR' }).format(n || 0);

/* saldo del soggiorno + imposta di soggiorno ancora dovuti al desk */
function bill(){
  const r = S.res;
  const taxFull = r.pax * r.nights * CONFIG.cityTax;
  const tax = r.taxIncluded ? 0 : taxFull;
  const stay = Math.max(0, (r.total || 0) - (r.paid || 0));
  return { stay, tax, taxFull, due: Math.round((stay + tax) * 100) / 100 };
}

/* ------------------------------------------------------------
   Navigazione e comportamenti
   ------------------------------------------------------------ */
function go(name){
  if(name === 'home'){ clearTimeout(S.timer); S.mode = null; S.res = null; S.data = {}; S.keyIdx = 0; }
  S.screen = name;
  document.getElementById('markSmall').style.visibility = name === 'home' ? 'hidden' : 'visible';
  main.innerHTML = '<div class="screen on">' + SCREENS[name]() + '</div>';
  main.scrollTop = 0;
  window.scrollTo(0, 0);
  wire(name);
}

function nextOf(name){
  const p = path(), i = p.indexOf(name);
  if(S.mode === 'out') return i === p.length - 1 ? 'coDone' : p[i+1];
  if(i === p.length - 1) return S.res && S.res.type === 'group' ? 'keys' : 'done';
  return p[i+1];
}

const isoToIt = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '')
  ? v.slice(8,10) + '/' + v.slice(5,7) + '/' + v.slice(0,4) : '';

function findRes(){
  const s = (document.getElementById('q')?.value || '').trim().toLowerCase();
  const c = (document.getElementById('qc')?.value || '').trim().toLowerCase();
  const room = (document.getElementById('qr')?.value || '').trim();
  const dEl = document.getElementById('qd');
  const d = dEl ? isoToIt(dEl.value) : '';
  if(dEl && s && !c && !d) return 'needDate';
  const hit = RESERVATIONS.find(r =>
    (s && r.surname.toLowerCase() === s) || (c && r.code.toLowerCase() === c)) || null;
  if(!hit) return null;
  if(d && hit.departure !== d) return null;
  if(room && !hit.rooms.includes(room)) return null;
  return hit;
}

function collect(){
  const out = [];
  let ok = true;
  document.querySelectorAll('.pax').forEach(b => {
    const g = {};
    b.querySelectorAll('input').forEach(inp => {
      if(inp.type === 'checkbox'){ g[inp.dataset.f] = inp.checked; return; }
      g[inp.dataset.f] = inp.value.trim();
      if(inp.hasAttribute('required') && !inp.value.trim()){
        ok = false;
        inp.style.borderColor = '#A32D2D';
      } else {
        inp.style.borderColor = '';
      }
    });
    out.push(g);
  });
  return ok ? out : null;
}

function scanPanel(){
  return '<div class="scan" style="padding:22px"><p class="big">' + esc(t('scanBig')) + '</p>' +
    '<p class="sub" id="scanwho" style="margin-bottom:0">' + esc(t('scanSub')) + '</p></div>';
}

/* una scheda è completa quando tutti i campi obbligatori sono valorizzati */
function paxComplete(b){
  return [...b.querySelectorAll('input[required]')].every(i => i.value.trim() !== '');
}
function nextTarget(){
  const b = [...document.querySelectorAll('.pax')];
  for(let i = 0; i < b.length; i++) if(!paxComplete(b[i])) return i;
  return -1;
}
function whoLabel(i, total){
  const b = document.querySelectorAll('.pax')[i];
  const rb = b.closest('[data-roomblock]');
  const room = rb ? t('roomLbl') + ' ' + rb.dataset.roomblock + ' · ' : '';
  return room + (b.querySelector('.who')?.textContent || '') + ' · ' + (i + 1) + ' ' + t('ofLbl') + ' ' + total;
}

/* aggiorna di chi è il turno allo scanner, senza ridisegnare la schermata */
function refreshScanner(){
  const blocks = [...document.querySelectorAll('.pax')];
  if(!blocks.length) return;
  S.target = nextTarget();
  blocks.forEach((b, i) => {
    const done = paxComplete(b);
    b.classList.toggle('filled', done);
    b.classList.toggle('waiting', i === S.target);
    const st = b.querySelector('.state');
    if(st) st.textContent = done ? '· ' + t('scanOk') : (i === S.target ? '· ' + t('scanWait') : '');
  });
  const who = document.getElementById('scanwho');
  if(!who) return;
  who.innerHTML = S.target < 0
    ? esc(t('scanAllDone'))
    : '<b>' + esc(whoLabel(S.target, blocks.length)) + '</b>';
}

  { name:'Sofia',    surname:'Gruber',   birth:'21/11/1992', place:'Bressanone',doc:'AX44120RM', nat:'Italia' },

function demoPerson(i){
  if(i === 0){
    const p = (S.res.lead || '').split(' ');
    return { name:p[0] || 'Anna', surname:p.slice(1).join(' ') || S.res.surname,
             birth:'14/03/1985', place:'Bolzano', doc:'CA98231KZ', nat:'Italia' };
  }
  return DEMO[(i - 1) % DEMO.length];
}

/* lettura del documento nella scheda indicata */
function scanFill(i){
  const b = document.querySelectorAll('.pax')[i];
  if(!b) return;
  const d = demoPerson(i);
  b.querySelectorAll('input').forEach(inp => {
    if(inp.type === 'checkbox') return;
    if(d[inp.dataset.f]){ inp.value = d[inp.dataset.f]; inp.style.borderColor = ''; }
  });
  refreshScanner();
  const nxt = document.querySelectorAll('.pax')[S.target];
  (nxt || b).scrollIntoView({ behavior:'smooth', block:'center' });
}

function wire(name){
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

  main.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if(b.dataset.mode === 'in' && !checkinOpen()) return showEarly();
    S.mode = b.dataset.mode; S.res = null;
    go(S.mode === 'in' ? 'search' : 'coSearch');
  });

  if(main.querySelector('.pax')){
    main.querySelectorAll('[data-scanhere]').forEach(b =>
      b.onclick = () => scanFill(Number(b.dataset.scanhere)));
    main.querySelectorAll('.pax input').forEach(i => i.addEventListener('input', refreshScanner));
    refreshScanner();
  }

  const nk = document.getElementById('nextkey');
  if(nk) nk.onclick = () => {
    S.keyIdx++;
    go(S.keyIdx >= roomingList().length ? 'done' : 'keys');
  };


  const next = document.getElementById('go');
  if(!next) return;
  const err = document.getElementById('err');

  next.onclick = () => {
    if(name === 'search' || name === 'coSearch'){
      const r = findRes();
      if(r === 'needDate'){ err.textContent = t('needDate'); return; }
      if(!r){ err.textContent = t('notFound'); return; }
      S.res = r; err.textContent = '';
      return go(nextOf(name));
    }
    if(name === 'docs' || name === 'group'){
      const g = collect();
      if(!g){ err.textContent = t('missing'); return; }
      S.data.guests = g; err.textContent = '';
      if(name === 'group') S.data.rooming = buildRooming();
      return go(nextOf(name));
    }
    if(name === 'pay'){
      const b = bill();
      if(b.due <= 0) return go(nextOf('pay'));
      main.innerHTML = '<div class="screen on">' + posWait(b.due) + '</div>';
      clearTimeout(S.timer);
      S.timer = setTimeout(() => go(nextOf('pay')), 3200);
      return;
    }
    if(name === 'terms'){
      const c1 = document.getElementById('c1').checked, c2 = document.getElementById('c2').checked;
      if(!c1 || !c2){ err.textContent = t('missing'); return; }
      err.textContent = '';
      return go(nextOf(name));
    }
    go(nextOf(name));
  };
}
